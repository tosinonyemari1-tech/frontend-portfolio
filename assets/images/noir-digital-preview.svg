  <text x="550" y="78" fill="#666" font-size="11" font-family="sans-serif">Services</text>
  <text x="610" y="78" fill="#666" font-size="11" font-family="sans-serif">About</text>
  <text x="660" y="78" fill="#666" font-size="11" font-family="sans-serif">Contact</text>
