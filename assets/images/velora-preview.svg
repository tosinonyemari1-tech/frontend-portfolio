<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#2d1f1f"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#c9a87c"/>
      <stop offset="100%" stop-color="#8b6f4e"/>
    </linearGradient>
  </defs>
  <!-- Browser Chrome -->
  <rect width="800" height="500" rx="12" fill="#1a1a1a"/>
  <rect y="0" width="800" height="40" rx="12" fill="#222"/>
  <rect y="10" width="800" height="30" fill="#222"/>
  <circle cx="20" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="5" fill="#febc2e"/>
  <circle cx="60" cy="20" r="5" fill="#28c840"/>
  <rect x="200" y="10" width="400" height="20" rx="10" fill="#333"/>
  <text x="400" y="24" fill="#666" font-size="10" text-anchor="middle" font-family="sans-serif">velora.fashion</text>
  <!-- Content -->
  <rect x="0" y="40" width="800" height="460" fill="url(#bg2)"/>
  <!-- Announcement Bar -->
  <rect x="0" y="40" width="800" height="28" fill="#c9a87c"/>
  <text x="400" y="58" fill="#1a1a1a" font-size="11" text-anchor="middle" font-family="sans-serif" font-weight="500">Free shipping on orders over $150</text>
  <!-- Nav -->
  <rect x="0" y="68" width="800" height="50" fill="#1a1a1a" opacity="0.95"/>
  <text x="40" y="98" fill="#fff" font-size="16" font-weight="bold" font-family="sans-serif" letter-spacing="4">VELORA</text>
  <text x="300" y="98" fill="#999" font-size="11" font-family="sans-serif">Collections</text>
  <text x="380" y="98" fill="#999" font-size="11" font-family="sans-serif">Shop</text>
  <text x="430" y="98" fill="#999" font-size="11" font-family="sans-serif">About</text>
  <text x="480" y="98" fill="#999" font-size="11" font-family="sans-serif">Reviews</text>
  <!-- Hero -->
  <text x="400" y="160" fill="#c9a87c" font-size="12" text-anchor="middle" font-family="sans-serif" letter-spacing="3">NEW COLLECTION 2026</text>
  <text x="400" y="210" fill="#fff" font-size="42" text-anchor="middle" font-family="serif" font-style="italic">Timeless</text>
  <text x="400" y="255" fill="#fff" font-size="42" text-anchor="middle" font-family="serif" font-style="italic">Elegance</text>
  <text x="400" y="285" fill="#999" font-size="12" text-anchor="middle" font-family="sans-serif">Curated fashion for the modern individual</text>
  <!-- CTA Buttons -->
  <rect x="340" y="300" width="120" height="36" rx="4" fill="#fff"/>
  <text x="400" y="322" fill="#1a1a1a" font-size="12" text-anchor="middle" font-family="sans-serif" font-weight="600">Shop Now</text>
  <text x="400" y="360" fill="#c9a87c" font-size="11" text-anchor="middle" font-family="sans-serif">View Collections →</text>
  <!-- Product Grid -->
  <rect x="40" y="380" width="160" height="100" rx="8" fill="#2a2015"/>
  <rect x="220" y="380" width="160" height="100" rx="8" fill="#1a2a20"/>
  <rect x="400" y="380" width="160" height="100" rx="8" fill="#1a1a2a"/>
  <rect x="580" y="380" width="180" height="100" rx="8" fill="#2a1a20"/>
  <!-- Product shapes -->
  <ellipse cx="120" cy="420" rx="25" ry="35" fill="#c9a87c" opacity="0.3"/>
  <ellipse cx="300" cy="420" rx="25" ry="35" fill="#c9a87c" opacity="0.25"/>
  <ellipse cx="480" cy="420" rx="25" ry="35" fill="#c9a87c" opacity="0.2"/>
  <rect x="650" y="405" width="40" height="60" rx="4" fill="#c9a87c" opacity="0.2"/>
  <text x="120" y="465" fill="#999" font-size="10" text-anchor="middle" font-family="sans-serif">Silk Blouse</text>
  <text x="300" y="465" fill="#999" font-size="10" text-anchor="middle" font-family="sans-serif">Linen Trousers</text>
  <text x="480" y="465" fill="#999" font-size="10" text-anchor="middle" font-family="sans-serif">Cashmere Coat</text>
  <text x="670" y="465" fill="#999" font-size="10" text-anchor="middle" font-family="sans-serif">Leather Bag</text>
</svg>