<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#0d2847"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <!-- Browser Chrome -->
  <rect width="800" height="500" rx="12" fill="#1a1a2e"/>
  <rect y="0" width="800" height="40" rx="12" fill="#252540"/>
  <rect y="10" width="800" height="30" fill="#252540"/>
  <circle cx="20" cy="20" r="5" fill="#ff5f57"/>
  <circle cx="40" cy="20" r="5" fill="#febc2e"/>
  <circle cx="60" cy="20" r="5" fill="#28c840"/>
  <rect x="200" y="10" width="400" height="20" rx="10" fill="#1a1a2e"/>
  <text x="400" y="24" fill="#666" font-size="10" text-anchor="middle" font-family="sans-serif">nexa.finance</text>
  <!-- Dashboard Content -->
  <rect x="0" y="40" width="800" height="460" fill="url(#bg1)"/>
  <!-- Sidebar -->
  <rect x="0" y="40" width="60" height="460" fill="#0a1628"/>
  <rect x="15" y="60" width="30" height="30" rx="8" fill="#3b82f6" opacity="0.2"/>
  <rect x="15" y="100" width="30" height="4" rx="2" fill="#333"/>
  <rect x="15" y="112" width="20" height="4" rx="2" fill="#333"/>
  <rect x="15" y="132" width="30" height="4" rx="2" fill="#3b82f6"/>
  <rect x="15" y="144" width="25" height="4" rx="2" fill="#3b82f6" opacity="0.5"/>
  <rect x="15" y="164" width="30" height="4" rx="2" fill="#333"/>
  <rect x="15" y="176" width="20" height="4" rx="2" fill="#333"/>
  <!-- Main Content -->
  <text x="90" y="75" fill="#fff" font-size="18" font-weight="bold" font-family="sans-serif">Dashboard</text>
  <text x="90" y="95" fill="#666" font-size="11" font-family="sans-serif">Welcome back, Alex</text>
  <!-- Balance Card -->
  <rect x="90" y="110" width="220" height="100" rx="12" fill="#111827" stroke="#1e3a5f" stroke-width="1"/>
  <text x="110" y="140" fill="#666" font-size="11" font-family="sans-serif">Total Balance</text>
  <text x="110" y="170" fill="#fff" font-size="28" font-weight="bold" font-family="sans-serif">$48,562</text>
  <text x="110" y="195" fill="#22c55e" font-size="11" font-family="sans-serif">↑ +12.5% this month</text>
  <!-- Stats Cards -->
  <rect x="330" y="110" width="120" height="45" rx="8" fill="#111827"/>
  <text x="345" y="130" fill="#666" font-size="10" font-family="sans-serif">Income</text>
  <text x="345" y="148" fill="#22c55e" font-size="14" font-weight="bold" font-family="sans-serif">+$12,480</text>
  <rect x="460" y="110" width="120" height="45" rx="8" fill="#111827"/>
  <text x="475" y="130" fill="#666" font-size="10" font-family="sans-serif">Expenses</text>
  <text x="475" y="148" fill="#ef4444" font-size="14" font-weight="bold" font-family="sansserif">-$8,320</text>
  <rect x="330" y="165" width="120" height="45" rx="8" fill="#111827"/>
  <text x="345" y="185" fill="#666" font-size="10" font-family="sans-serif">Savings</text>
  <text x="345" y="203" fill="#3b82f6" font-size="14" font-weight="bold" font-family="sans-serif">+$4,160</text>
  <rect x="460" y="165" width="120" height="45" rx="8" fill="#111827"/>
  <text x="475" y="185" fill="#666" font-size="10" font-family="sans-serif">Investments</text>
  <text x="475" y="203" fill="#a855f7" font-size="14" font-weight="bold" font-family="sans-serif">$24,890</text>
  <!-- Chart Area -->
  <rect x="90" y="230" width="490" height="220" rx="12" fill="#111827"/>
  <text x="110" y="260" fill="#fff" font-size="13" font-weight="bold" font-family="sans-serif">Revenue Overview</text>
  <text x="300" y="260" fill="#3b82f6" font-size="11" font-family="sans-serif">This Week</text>
  <!-- Chart Bars -->
  <rect x="120" y="370" width="40" height="60" rx="4" fill="#3b82f6" opacity="0.3"/>
  <rect x="180" y="340" width="40" height="90" rx="4" fill="#3b82f6" opacity="0.4"/>
  <rect x="240" y="320" width="40" height="110" rx="4" fill="#3b82f6" opacity="0.5"/>
  <rect x="300" y="300" width="40" height="130" rx="4" fill="#3b82f6" opacity="0.7"/>
  <rect x="360" y="330" width="40" height="100" rx="4" fill="#3b82f6" opacity="0.5"/>
  <rect x="420" y="290" width="40" height="140" rx="4" fill="url(#accent1)"/>
  <rect x="480" y="310" width="40" height="120" rx="4" fill="#3b82f6" opacity="0.6"/>
  <!-- Chart Labels -->
  <text x="140" y="450" fill="#666" font-size="9" text-anchor="middle" font-family="sans-serif">Mon</text>
  <text x="200" y="450" fill="#666" font-size="9" text-anchor="middle" font-family="sans-serif">Tue</text>
  <text x="260" y="450" fill="#666" font-size="9" text-anchor="middle" font-family="sans-serif">Wed</text>
  <text x="320" y="450" fill="#666" font-size="9" text-anchor="middle" font-family="sans-serif">Thu</text>
  <text x="380" y="450" fill="#666" font-size="9" text-anchor="middle" font-family="sans-serif">Fri</text>
  <text x="440" y="450" fill="#666" font-size="9" text-anchor="middle" font-family="sans-serif">Sat</text>
  <text x="500" y="450" fill="#666" font-size="9" text-anchor="middle" font-family="sans-serif">Sun</text>
  <!-- Right Panel - Transactions -->
  <rect x="600" y="110" width="180" height="340" rx="12" fill="#111827"/>
  <text x="620" y="140" fill="#fff" font-size="12" font-weight="bold" font-family="sans-serif">Recent Activity</text>
  <rect x="620" y="155" width="140" height="1" fill="#1e3a5f"/>
  <!-- Transaction items -->
  <circle cx="635" cy="180" r="12" fill="#3b82f6" opacity="0.2"/>
  <text x="635" y="184" fill="#3b82f6" font-size="10" text-anchor="middle" font-family="sans-serif">💳</text>
  <text x="655" y="177" fill="#fff" font-size="10" font-family="sans-serif">Netflix</text>
  <text x="655" y="191" fill="#666" font-size="9" font-family="sans-serif">-$15.99</text>
  
  <circle cx="635" cy="220" r="12" fill="#22c55e" opacity="0.2"/>
  <text x="635" y="224" fill="#22c55e" font-size="10" text-anchor="middle" font-family="sans-serif">💰</text>
  <text x="655" y="217" fill="#fff" font-size="10" font-family="sans-serif">Salary</text>
  <text x="655" y="231" fill="#22c55e" font-size="9" font-family="sans-serif">+$4,200</text>

  <circle cx="635" cy="260" r="12" fill="#f59e0b" opacity="0.2"/>
  <text x="635" y="264" fill="#f59e0b" font-size="10" text-anchor="middle" font-family="sans-serif">🛒</text>
  <text x="655" y="257" fill="#fff" font-size="10" font-family="sans-serif">Amazon</text>
  <text x="655" y="271" fill="#f59e0b" font-size="9" font-family="sans-serif">-$89.50</text>

  <circle cx="635" cy="300" r="12" fill="#3b82f6" opacity="0.2"/>
  <text x="635" y="304" fill="#3b82f6" font-size="10" text-anchor="middle" font-family="sans-serif">☕</text>
  <text x="655" y="297" fill="#fff" font-size="10" font-family="sans-serif">Starbucks</text>
  <text x="655" y="311" fill="#3b82f6" font-size="9" font-family="sans-serif">-$5.75</text>
</svg>